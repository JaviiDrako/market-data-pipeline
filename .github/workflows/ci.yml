name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests & dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate project imports
        env:
          PYTHONPATH: .
        run: |
          python -c "from src.common.logger import get_logger; get_logger('ci').info('logger ok')"
          python -c "from src.config.settings import Settings; s=Settings(); print(s.get_symbols('binance'))"
          python -c "from src.pipelines.bronze_pipeline import BronzePipeline"
          python -c "from src.pipelines.bootstrap_pipeline import BootstrapPipeline"
          python -c "from src.common.interval_cron import interval_to_cron; assert interval_to_cron('1m') == '* * * * *'"

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests/unit -v

      - name: dbt parse
        working-directory: dbt
        env:
          # profiles.yml accepts defaults; parse does not need a live warehouse.
          DBT_HOST: localhost
          DBT_PORT: "5433"
          DBT_USER: ci
          DBT_PASSWORD: ci
          DBT_DBNAME: ci
        run: dbt parse --profiles-dir .
