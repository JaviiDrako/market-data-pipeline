version: 2

models:
  - name: market_indicators_5m
    description: Gold layer technical indicators computed on 5-minute Silver candles.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]
      - name: ema_9
      - name: ema_21
      - name: ema_50
      - name: ema_200
      - name: sma_20
      - name: sma_50
      - name: sma_200
      - name: rsi_14
      - name: macd
      - name: macd_signal
      - name: macd_histogram
      - name: atr_14
      - name: bb_upper
      - name: bb_middle
      - name: bb_lower

  - name: market_indicators_15m
    description: Gold layer technical indicators computed on 15-minute Silver candles.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_indicators_30m
    description: Gold layer technical indicators computed on 30-minute Silver candles.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_indicators_1h
    description: Gold layer technical indicators computed on 1-hour Silver candles.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_indicators_1d
    description: Gold layer technical indicators computed on daily Silver candles.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  # Gold Features - Trading Features layer (consumes Indicators + Candles)
  - name: market_features_5m
    description: |
      Gold Features for 5-minute timeframe.
      Derived exclusively from market_indicators_5m and market_candles_5m.
      Contains only computed trading features + natural key. No OHLCV or raw indicator duplication.
    columns:
      - name: exchange
        description: Exchange identifier.
        tests: [not_null]
      - name: symbol
        description: Trading pair symbol.
        tests: [not_null]
      - name: open_time
        description: Candle open timestamp.
        tests: [not_null]
      - name: ema9_distance_pct
      - name: ema_alignment
      - name: rsi_normalized
      - name: atr_pct
      - name: candle_body_ratio

  - name: market_features_15m
    description: Gold Features for 15-minute timeframe. Derived from indicators and candles only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_features_30m
    description: Gold Features for 30-minute timeframe. Derived from indicators and candles only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_features_1h
    description: Gold Features for 1-hour timeframe. Derived from indicators and candles only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_features_1d
    description: Gold Features for daily timeframe. Derived from indicators and candles only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  # Ephemeral feature category implementations (reusable logic references)
  - name: trend_features
    description: Ephemeral model grouping all trend-based trading features (EMA distances, alignment, slopes, price vs ema).
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: momentum_features
    description: Ephemeral model grouping momentum trading features (normalized RSI, MACD strength, price changes).
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: volatility_features
    description: Ephemeral model grouping volatility trading features (ATR pct, rolling std, Bollinger metrics).
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: price_action_features
    description: Ephemeral model grouping price action trading features (candle ratios, distance to recent highs/lows).
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  # Gold Signals - Generic trading signals derived from Features + Indicators
  - name: market_signals_5m
    description: |
      Gold Signals for 5-minute timeframe.
      Derived exclusively from market_features_5m and market_indicators_5m.
      Boolean/integer signals only. No OHLCV, indicators or features stored.
    columns:
      - name: exchange
        description: Exchange identifier.
        tests: [not_null]
      - name: symbol
        description: Trading pair symbol.
        tests: [not_null]
      - name: open_time
        description: Candle open timestamp.
        tests: [not_null]
      - name: ema_bullish_alignment
        description: Strict bullish EMA alignment (9>21>50>200).
        tests: [not_null]
      - name: ema_bearish_alignment
      - name: price_above_ema50
      - name: price_above_ema200
      - name: golden_cross
      - name: death_cross
      - name: rsi_overbought
      - name: rsi_oversold
      - name: rsi_recovering
      - name: macd_bullish_cross
      - name: macd_bearish_cross
      - name: macd_positive
      - name: high_volatility
      - name: low_volatility
      - name: bollinger_breakout_up
      - name: bollinger_breakout_down
      - name: new_20_high
      - name: new_20_low
      - name: new_50_high
      - name: new_50_low
      - name: breakout_confirmation

  - name: market_signals_15m
    description: Gold Signals for 15-minute timeframe. Derived from features and indicators only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_signals_30m
    description: Gold Signals for 30-minute timeframe. Derived from features and indicators only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_signals_1h
    description: Gold Signals for 1-hour timeframe. Derived from features and indicators only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_signals_1d
    description: Gold Signals for daily timeframe. Derived from features and indicators only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  # Gold Feature Tables - Final consolidated datasets (keys + Features + Signals)
  - name: market_dataset_5m
    description: |
      Final Gold Feature Table for 5-minute timeframe.
      Consolidated dataset containing only keys + all trading features + all signals.
      No OHLCV or raw indicators. Intended for trading bot, backtesting, ML and dashboards.
      Consumes exclusively market_indicators_5m, market_features_5m and market_signals_5m.
    columns:
      - name: exchange
        description: Exchange identifier.
        tests: [not_null]
      - name: symbol
        description: Trading pair symbol.
        tests: [not_null]
      - name: open_time
        description: Candle open timestamp.
        tests: [not_null]
      - name: ema9_distance_pct
      - name: ema_alignment
      - name: rsi_normalized
      - name: atr_pct
      - name: candle_body_ratio
      - name: ema_bullish_alignment
      - name: rsi_overbought
      - name: high_volatility
      - name: new_20_high
      - name: breakout_confirmation

  - name: market_dataset_15m
    description: Final Gold Feature Table for 15-minute timeframe. Keys + Features + Signals only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_dataset_30m
    description: Final Gold Feature Table for 30-minute timeframe. Keys + Features + Signals only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_dataset_1h
    description: Final Gold Feature Table for 1-hour timeframe. Keys + Features + Signals only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  - name: market_dataset_1d
    description: Final Gold Feature Table for daily timeframe. Keys + Features + Signals only.
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: open_time
        tests: [not_null]

  # BI consumption layer (Power BI) — does not replace market_dataset_*
  - name: market_dataset_bi
    description: |
      Business Intelligence consumption view for Power BI.
      Unifies market_dataset_5m / 15m / 30m / 1h / 1d via UNION ALL and adds a
      timeframe column (5m, 15m, 30m, 1h, 1d).
      This is the preferred read model for BI dashboards only.
      It does not replace the existing Gold Feature Tables.
      Trading Bot and future ML consumers continue to use market_dataset_*
      directly.
    columns:
      - name: exchange
        description: Exchange identifier.
        tests: [not_null]
      - name: symbol
        description: Trading pair symbol.
        tests: [not_null]
      - name: open_time
        description: Candle open timestamp for the source timeframe bar.
        tests: [not_null]
      - name: timeframe
        description: Source candle timeframe label (5m, 15m, 30m, 1h, 1d).
        tests: [not_null]

  - name: market_candles_bi
    description: |
      Business Intelligence consumption view for Power BI OHLCV and candlestick
      visualizations. Unifies the five Silver aggregated candle models with a
      timeframe label. It contains no new calculations and does not replace the
      Silver candle models.
    columns:
      - name: exchange
        description: Exchange identifier.
        tests: [not_null]
      - name: symbol
        description: Trading pair symbol.
        tests: [not_null]
      - name: open_time
        description: Candle open timestamp.
        tests: [not_null]
      - name: close_time
        description: Candle close timestamp.
      - name: open_price
        description: Candle opening price.
      - name: high_price
        description: Highest traded price in the candle.
      - name: low_price
        description: Lowest traded price in the candle.
      - name: close_price
        description: Candle closing price.
      - name: volume
        description: Base-asset volume traded in the candle.
      - name: quote_asset_volume
        description: Quote-asset volume traded in the candle.
      - name: number_of_trades
        description: Number of trades in the candle.
      - name: taker_buy_base_volume
        description: Taker buy base-asset volume.
      - name: taker_buy_quote_volume
        description: Taker buy quote-asset volume.
      - name: ingested_at
        description: Timestamp of the latest source ingestion contributing to the candle.
      - name: candle_direction
        description: Candle direction (1 bullish, -1 bearish, 0 doji).
      - name: body_size
        description: Absolute candle body size.
      - name: upper_wick
        description: Upper candle wick size.
      - name: lower_wick
        description: Lower candle wick size.
      - name: candle_range
        description: High-to-low candle range.
      - name: typical_price
        description: Typical price attribute already calculated in Silver.
      - name: ohlc_average
        description: OHLC average attribute already calculated in Silver.
      - name: timeframe
        description: Source candle timeframe label (5m, 15m, 30m, 1h, 1d).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['5m', '15m', '30m', '1h', '1d']
