services:
  postgres:
    image: postgres:16
    container_name: market_data_postgres
    restart: unless-stopped
    env_file:
      - ./docker/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow_init:
    image: apache/airflow:2.9.3
    container_name: market_data_airflow_init
    restart: "no"
    env_file:
      - ./docker/.env
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: >
      bash -c 'airflow db migrate && airflow users create
      --username "$${AIRFLOW_ADMIN_USERNAME}"
      --password "$${AIRFLOW_ADMIN_PASSWORD}"
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email "$${AIRFLOW_ADMIN_EMAIL}" || true'

  airflow_webserver:
    image: apache/airflow:2.9.3
    container_name: market_data_airflow_webserver
    restart: unless-stopped
    env_file:
      - ./docker/.env
    environment: *airflow_environment
    depends_on:
      postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: webserver

  airflow_scheduler:
    image: apache/airflow:2.9.3
    container_name: market_data_airflow_scheduler
    restart: unless-stopped
    env_file:
      - ./docker/.env
    environment: *airflow_environment
    depends_on:
      postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler

volumes:
  postgres_data:
