services:
  postgres:
    image: postgres:16
    container_name: market_data_postgres
    restart: unless-stopped
    env_file:
      - ./docker/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow_init:
    image: apache/airflow:2.9.3
    container_name: market_data_airflow_init
    restart: "no"
    env_file:
      - ./docker/.env
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      # AIRFLOW__WEBSERVER__SECRET_KEY is loaded from docker/.env (env_file)
      # and must be identical on webserver + scheduler for UI task log serving.
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
      # Project code + config for DAGs (orchestration only; logic stays in src/dbt)
      PROJECT_ROOT: /opt/airflow/project
      PYTHONPATH: /opt/airflow/project
      # Warehouse reachable on Docker network
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: airflow
      DBT_PASSWORD: airflow
      DBT_DBNAME: market_data
      # Install pipeline + dbt deps inside the Airflow image on start
      _PIP_ADDITIONAL_REQUIREMENTS: dbt-postgres==1.10.2 psycopg[binary]==3.2.10 PyYAML==6.0.3 requests==2.34.2 tenacity==8.2.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      # Shared task logs so the webserver can serve scheduler-written logs
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c 'airflow db migrate && airflow users create
      --username "$${AIRFLOW_ADMIN_USERNAME}"
      --password "$${AIRFLOW_ADMIN_PASSWORD}"
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email "$${AIRFLOW_ADMIN_EMAIL}" || true'

  airflow_webserver:
    image: apache/airflow:2.9.3
    container_name: market_data_airflow_webserver
    restart: unless-stopped
    env_file:
      - ./docker/.env
    environment: *airflow_environment
    depends_on:
      postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver

  airflow_scheduler:
    image: apache/airflow:2.9.3
    container_name: market_data_airflow_scheduler
    restart: unless-stopped
    env_file:
      - ./docker/.env
    environment: *airflow_environment
    depends_on:
      postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    command: scheduler

volumes:
  postgres_data:
  airflow_logs:
